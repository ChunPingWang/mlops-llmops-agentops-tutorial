networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  clickhouse_data:
  minio_data:
  mlflow_data:
  grafana_data:
  open_webui_data:
  dagster_data:

services:
  # =============================================================================
  # Data layer (7.2)
  # =============================================================================

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks: [data-net, backend-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    env_file: .env
    volumes:
      - redis_data:/data
    networks: [data-net, backend-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme-clickhouse-password}
    env_file: .env
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [data-net, backend-net]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Allow Prometheus to scrape /minio/v2/metrics/cluster without a bearer token.
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
    env_file: .env
    volumes:
      - minio_data:/data
    networks: [data-net, backend-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: create the langfuse bucket inside MinIO so Langfuse v3
  # event/media uploads have a destination on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    networks: [data-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio-admin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/langfuse;
      mc mb --ignore-existing local/mlflow;
      mc mb --ignore-existing local/mem0;
      echo 'MinIO buckets ready';
      "
    restart: "no"

  # =============================================================================
  # Observability
  # =============================================================================

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    env_file: .env
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [backend-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "0.0.0.0:3001:3000"
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
    networks: [frontend-net, backend-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Core services (7.1)
  # =============================================================================

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: ${LITELLM_DATABASE_URL}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      AZURE_API_KEY: ${AZURE_API_KEY}
      AZURE_API_BASE: ${AZURE_API_BASE}
      AZURE_API_VERSION: ${AZURE_API_VERSION}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml
    networks: [frontend-net, backend-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # litellm image is slim Python — no wget/curl. Use bash /dev/tcp/ to
      # confirm the API port is accepting connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4000' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Langfuse v3 — split into web (UI/API) + worker (async event ingestion).
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    ports:
      - "0.0.0.0:3100:3000"
    environment:
      # Make Next.js bind on 0.0.0.0 (default is the container's eth0 IP only,
      # which breaks loopback healthchecks).
      HOSTNAME: "0.0.0.0"
      # Auto-bootstrap a default org/project/user/api-key on first startup.
      # Once provisioned these keys are deterministic across restarts.
      LANGFUSE_INIT_ORG_ID: "poc-org"
      LANGFUSE_INIT_ORG_NAME: "PoC Org"
      LANGFUSE_INIT_PROJECT_ID: "poc-project"
      LANGFUSE_INIT_PROJECT_NAME: "PoC Project"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-PoC Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-changeme-langfuse-password}
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:-redis://redis:6379}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-minio-admin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-minio-admin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
    env_file: .env
    networks: [frontend-net, backend-net]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Langfuse v3 (Next.js standalone) binds to the container's eth0 IP,
      # NOT to 127.0.0.1 / localhost. Use $HOSTNAME which resolves via
      # /etc/hosts to that exact interface.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://$$HOSTNAME:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment:
      DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:-redis://redis:6379}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-minio-admin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-minio-admin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_FORCE_PATH_STYLE:-true}
    env_file: .env
    networks: [backend-net]
    depends_on:
      langfuse-web:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      # Bound to localhost like the other dev services; was 0.0.0.0 before.
      - "127.0.0.1:6333:6333"
    env_file: .env
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [backend-net]
    restart: unless-stopped
    healthcheck:
      # Qdrant image ships only bash/sh — no wget/curl. Use bash /dev/tcp/
      # to confirm the HTTP port is accepting connections.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nemo-guardrails:
    # nvcr.io does NOT publish a public nemo-guardrails image. Build from
    # the upstream pip package using configs/nemo-guardrails/Dockerfile.
    build:
      context: ./configs/nemo-guardrails
    ports:
      - "0.0.0.0:8090:8090"
    environment:
      GUARDRAILS_LLM_BASE_URL: ${GUARDRAILS_LLM_BASE_URL:-http://litellm:4000/v1}
      # ${LITELLM_MASTER_KEY} IS expanded here because this is in environment:,
      # not env_file:.
      GUARDRAILS_LLM_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
    env_file: .env
    volumes:
      - ./configs/guardrails:/app/config
    networks: [backend-net]
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # slim Python base has no wget. TCP check on the API port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8090' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "0.0.0.0:3080:8080"
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      # Without OPENAI_API_KEY every request to LiteLLM returns 401.
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-changeme-webui-secret}
    env_file: .env
    volumes:
      - open_webui_data:/app/backend/data
    networks: [frontend-net, backend-net]
    depends_on:
      litellm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Open WebUI image lacks wget. TCP check on the API port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MLflow — custom image with psycopg2 baked in.
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: ./configs/mlflow
    ports:
      - "0.0.0.0:5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    env_file: .env
    volumes:
      - mlflow_data:/mlflow
    networks: [frontend-net, backend-net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # mlflow image lacks wget/curl. Use bash /dev/tcp/ for liveness.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/5000' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Dagster — webserver + daemon. Both mount the mlops/ project, share a
  # dagster_home volume, and use Postgres-backed storage.
  # ---------------------------------------------------------------------------
  dagster-webserver:
    build:
      context: ./configs/dagster
    ports:
      - "0.0.0.0:3070:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    env_file: .env
    command:
      - dagster-webserver
      - --host
      - "0.0.0.0"
      - --port
      - "3000"
      - --workspace
      - /opt/dagster/app/workspace.yaml
    volumes:
      - ./mlops:/opt/dagster/app
      - ./configs/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - dagster_data:/opt/dagster/dagster_home/storage
    networks: [frontend-net, backend-net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # dagster-webserver slim image lacks wget/curl. TCP check on the API port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dagster-daemon:
    build:
      context: ./configs/dagster
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:-postgres}
      DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    env_file: .env
    command: ["dagster-daemon", "run"]
    # NOTE: dagster-daemon doesn't have a 'health-check' subcommand. The
    # actual subcommand is 'liveness-check' (since dagster 1.4+).
    volumes:
      - ./mlops:/opt/dagster/app
      - ./configs/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - dagster_data:/opt/dagster/dagster_home/storage
    networks: [backend-net]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
