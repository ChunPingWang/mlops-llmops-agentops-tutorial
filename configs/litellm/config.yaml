model_list:
  # 邏輯 alias 保留 "gemma-4-26b" 不改，避免 agent/test 腳本全部要改。
  # 實際上游是 Mistral-Nemo——Gemma 4 是多模態（Gemma4ForConditional-
  # Generation）會被 OMLX 走 mlx_vlm loader，但 4-bit 量化版缺
  # preprocessor_config.json 而 crash；改用純文字模型避開這個 VLM 路徑。
  - model_name: "gemma-4-26b"
    litellm_params:
      model: "openai/mlx-community/Mistral-Nemo-Instruct-2407-4bit"
      api_base: "os.environ/LOCAL_LLM_BASE_URL"
      api_key: "os.environ/OMLX_API_KEY"

  # Embedding endpoint served by the same OMLX server.
  # model id MUST be the full HF repo path OMLX recognises (see `/v1/models`).
  - model_name: "text-embedding"
    litellm_params:
      model: "openai/mlx-community/mxbai-embed-large-v1"
      api_base: "os.environ/LOCAL_LLM_BASE_URL"
      api_key: "os.environ/OMLX_API_KEY"

  - model_name: "gpt-4o"
    litellm_params:
      model: "azure/gpt-4o"
      api_base: "os.environ/AZURE_API_BASE"
      api_key: "os.environ/AZURE_API_KEY"
      api_version: "os.environ/AZURE_API_VERSION"

  - model_name: "claude-sonnet"
    litellm_params:
      model: "anthropic/claude-sonnet-4-20250514"
      api_key: "os.environ/ANTHROPIC_API_KEY"

router_settings:
  fallbacks:
    - gemma-4-26b: ["gpt-4o", "claude-sonnet"]

litellm_settings:
  # success/failure callbacks attach Langfuse tracing AND expose Prometheus
  # metrics on /metrics (same port as the API). Required for V-05/V-23/V-24.
  success_callback: ["langfuse", "prometheus"]
  failure_callback: ["langfuse", "prometheus"]
  langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
  langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
  langfuse_host: "os.environ/LANGFUSE_HOST"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
