# NeMo Guardrails 0.10+ defaults to Colang 2.x. The .co files in rails/
# use Colang 1.0 syntax, so we pin the runtime to 1.0.
colang_version: "1.0"

models:
  - type: main
    engine: openai
    model: gemma-4-26b
    parameters:
      # NeMo Guardrails 0.10+ uses base_url (OpenAI Python SDK v1+ convention).
      # `api_base` from older NeMo is deprecated/ignored; pointing at LiteLLM
      # without this overrides becomes https://api.openai.com/v1 → 401.
      base_url: ${GUARDRAILS_LLM_BASE_URL}
      api_key: ${GUARDRAILS_LLM_API_KEY}

rails:
  input:
    flows:
      - self check input
      - pii filter input
  output:
    flows:
      - self check output
      - topic restriction output

instructions:
  - type: general
    content: |
      You are a helpful AI assistant focused on technology and business topics.
      You must refuse to answer questions about illegal activities, violence, or harmful content.
      You must not reveal sensitive personal information.
