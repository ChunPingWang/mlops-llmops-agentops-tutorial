global:
  scrape_interval: 15s

scrape_configs:
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
    metrics_path: /metrics

  - job_name: langfuse
    static_configs:
      - targets: ["langfuse:3100"]
    metrics_path: /api/public/metrics

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
